<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./src/style.css" />
    <title>Chat simulator</title>
  </head>
  <body>
    <main class="h-screen flex justify-center items-center bg-primary-milk-white">
      <div class="grid grid-rows-[400px_150px] gap-y-2 p-2 w-200 border-3 border-primary-dark-brown border-solid rounded-2xl bg-primary-dirty-light-green">
        <div class="relative h-full bg-primary-milk-white border border-primary-dark-brown border-solid rounded-t-2xl">
          <div class="absolute flex justify-center items-center top-0 left-0 w-full h-10 rounded-t-2xl backdrop-blur-md border-b border-primary-dark-brown/20 shadow-sm z-100">
            <h2 id="inform-typing" class="text-primary-dark-brown text-xl"></h2>
          </div>
          <div id="spinner" class="hidden absolute top-15 left-1/2 -transfrom-y-1/2">
            <svg aria-hidden="true" class="w-5 h-5 text-neutral-tertiary animate-spin fill-primary-dark-brown text-primary-light-brown" viewBox="0 0 100 101" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M100 50.5908C100 78.2051 77.6142 100.591 50 100.591C22.3858 100.591 0 78.2051 0 50.5908C0 22.9766 22.3858 0.59082 50 0.59082C77.6142 0.59082 100 22.9766 100 50.5908ZM9.08144 50.5908C9.08144 73.1895 27.4013 91.5094 50 91.5094C72.5987 91.5094 90.9186 73.1895 90.9186 50.5908C90.9186 27.9921 72.5987 9.67226 50 9.67226C27.4013 9.67226 9.08144 27.9921 9.08144 50.5908Z" fill="currentColor"/>
              <path d="M93.9676 39.0409C96.393 38.4038 97.8624 35.9116 97.0079 33.5539C95.2932 28.8227 92.871 24.3692 89.8167 20.348C85.8452 15.1192 80.8826 10.7238 75.2124 7.41289C69.5422 4.10194 63.2754 1.94025 56.7698 1.05124C51.7666 0.367541 46.6976 0.446843 41.7345 1.27873C39.2613 1.69328 37.813 4.19778 38.4501 6.62326C39.0873 9.04874 41.5694 10.4717 44.0505 10.1071C47.8511 9.54855 51.7191 9.52689 55.5402 10.0491C60.8642 10.7766 65.9928 12.5457 70.6331 15.2552C75.2735 17.9648 79.3347 21.5619 82.5849 25.841C84.9175 28.9121 86.7997 32.2913 88.1811 35.8758C89.083 38.2158 91.5421 39.6781 93.9676 39.0409Z" fill="currentFill"/>
            </svg>
          </div>
          <div id="chat-container" class="h-full overflow-y-scroll pt-20 pb-3 px-5 flex flex-col-reverse gap-y-5"></div>
        </div>

        <div class="grid grid-cols-2 content-center bg-primary-dirty-mid-green border border-primary-dark-brown border-solid rounded-b-2xl">
          <div class="flex flex-col justify-center items-center gap-y-5">
            <h3 class="text-xl text-primary-milk-white">User 2</h3>
            <div class="flex justify-between items-center gap-x-4">
              <label for="user-2">
                <input id="user-2" type="text" class="resize-none text-primary-milk-white outline-none border border-primary-dark-brown rounded-xl px-5 py-2" />
              </label>
              <button disabled id="user-2-submit" class="cursor-pointer text-primary-milk-white border border-primary-dark-brown rounded-xl px-5 py-2 hover:bg-primary-dark-brown disabled:bg-primary-dirty-light-green disabled:text-primary-dark-brown disabled:cursor-not-allowed">Send</button>
            </div>
          </div>
          <div class="flex flex-col justify-center items-center gap-y-5">
            <h3 class="text-xl text-primary-milk-white">User 1</h3>
            <div class="flex justify-between items-center gap-x-4">
              <label for="user-1">
                <input id="user-1" type="text" class="resize-none text-primary-milk-white outline-none border border-primary-dark-brown rounded-xl px-5 py-2" />
              </label>
              <button disabled id="user-1-submit" class="cursor-pointer text-primary-milk-white border border-primary-dark-brown rounded-xl px-5 py-2 hover:bg-primary-dark-brown disabled:bg-primary-dirty-light-green disabled:text-primary-dark-brown disabled:cursor-not-allowed">Send</button>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
